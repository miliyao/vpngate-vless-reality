services:
  web-panel:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    container_name: vless-web-panel
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      - PANEL_AUTH_ENABLED=${PANEL_AUTH_ENABLED:-true}
      - PANEL_USERNAME=${PANEL_USERNAME:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:?PANEL_PASSWORD is required. Copy .env.example to .env or run deploy.sh}
      - VPS_ADDRESS=${VPS_ADDRESS:-}
      - RE_DOMAINS=${RE_DOMAINS:-www.amd.com}
      # 实际实体机的数据目录的绝对路径，供 docker.js 在 docker.sock 模式下创建出口容器的卷绑定
      # 使用 PWD 的语法让其自动加载为执行 docker compose 时的工作目录
      - HOST_DATA_PATH=${HOST_DATA_PATH:-${PWD}/data}
    ports:
      - "${PANEL_PORT:-3000}:3000"
    volumes:
      # 挂载 Docker socket 使得后端可以通过 Docker API 管理出口容器
      - /var/run/docker.sock:/var/run/docker.sock
      # 挂载宿主机上的数据目录，用于持久化数据库和出口配置文件
      - ./data:/app/data
      # 挂载 Xray 配置模板
      - ./config:/app/config
    # 限制日志文件大小，避免磁盘被打满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vless-net

  self-healing-worker:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    container_name: vless-self-healing-worker
    restart: always
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - RE_DOMAINS=${RE_DOMAINS:-www.amd.com}
      - HOST_DATA_PATH=${HOST_DATA_PATH:-${PWD}/data}
    command: ["npm", "run", "start:worker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vless-net

networks:
  vless-net:
    name: vless-net
    driver: bridge
